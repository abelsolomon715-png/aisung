<script>
async function pollJobStatus(taskId) {
    const maxAttempts = 30;
    let attempts = 0;

    const interval = setInterval(async () => {
        attempts++;
        try {
            const response = await fetch(`/api/job-status/${taskId}`);
            const data = await response.json();

            console.log("Status check response:", data);

            if (data.status === 'completed' || data.status === 'SUCCESS' || data.audio_url || data.url) {
                clearInterval(interval);
                
                const audioUrl = data.audio_url || data.url || data.output_url || (data.data && data.data.audio_url);

                if (audioUrl) {
                    console.log("Audio URL found:", audioUrl);
                    if (typeof playAudio === 'function') {
                        playAudio(audioUrl);
                    }
                }
            } else if (data.status === 'failed' || attempts >= maxAttempts) {
                clearInterval(interval);
            }
        } catch (error) {
            console.error("Polling error:", error);
        }
    }, 4000);
}
</script>
