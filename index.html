!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Music Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
background-color: #0b1329;
color: #f1f5f9;
font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
}
</style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center items-start">
​<div class="w-full max-w-xl space-y-6">
<!-- Header -->
<div class="text-center space-y-2">
<h1 class="text-3xl font-extrabold text-sky-400">⚡ AI Studio Studio</h1>
<p class="text-xs text-slate-400">Generate custom tracks instantly with AI</p>
</div>
​<!-- Main Card -->
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-5">
​<!-- Mode Selection -->
<div>
<label class="block text-sm font-semibold text-slate-300 mb-2">🎵 Song Type</label>
<div class="grid grid-cols-2 gap-3">
<button id="btnFull" onclick="selectType('full')" class="p-3 border rounded-xl text-left bg-sky-950/60 border-sky-500 text-sky-200">
<div class="font-bold text-sm">Full Song</div>
<div class="text-xs text-slate-400">With vocals & lyrics</div>
</button>
<button id="btnInst" onclick="selectType('instrumental')" class="p-3 border rounded-xl text-left bg-slate-800 border-slate-700 text-slate-300">
<div class="font-bold text-sm">Instrumental Mix</div>
<div class="text-xs text-slate-400">Instruments only</div>
</button>
</div>
</div>
​<!-- Prompt Input -->
<div>
<label class="block text-sm font-semibold text-slate-300 mb-2">⚡ Describe Your Track</label>
<textarea id="promptInput" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-sky-500 text-white placeholder-slate-600" placeholder="e.g. Urban club rap flow, heavy bass bounce & rhythmic cadence"></textarea>
</div>
​<!-- Quick Ingredients -->
<div>
<label class="block text-xs font-semibold text-slate-400 mb-2">⚡ Quick Sonic Ingredients (Tap to add):</label>
<div class="flex flex-wrap gap-2">
<button onclick="addIngredient('Krar')" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-700">Krar</button>
<button onclick="addIngredient('Pentatonic Scale')" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-700">Pentatonic Scale</button>
<button onclick="addIngredient('Guayla Rhythm')" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-700">Guayla Rhythm</button>
<button onclick="addIngredient('Ethio-Jazz Groove')" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-700">Ethio-Jazz Groove</button>
<button onclick="addIngredient('Kebero Drums')" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-700">Kebero Drums</button>
<button onclick="addIngredient('Deep Bass')" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-700">Deep Bass</button>
</div>
</div>
​<!-- Submit Button -->
<button id="generateBtn" onclick="handleGenerate()" class="w-full bg-sky-500 hover:bg-sky-400 font-bold text-slate-950 py-3.5 rounded-xl transition-all flex items-center justify-center space-x-2">
<span id="btnText">Create Mix</span>
<div id="btnSpinner" class="hidden animate-spin rounded-full h-5 w-5 border-b-2 border-slate-950"></div>
</button>
​<!-- Status Toast -->
<div id="statusToast" class="hidden text-center text-xs font-medium py-2 rounded-lg bg-sky-950/80 text-sky-300 border border-sky-800/50"></div>
​</div>
​<!-- History Panel -->
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-4">
<h2 class="text-base font-bold text-slate-200 flex items-center space-x-2">
<span>📁 Your Mixes History</span>
</h2>
​<div id="mixesContainer" class="space-y-3">
<p id="emptyText" class="text-xs text-slate-500 text-center py-4">No mixes generated yet.</p>
</div>
</div>
​</div>
​<script>
let songType = 'full';
​function selectType(type) {
songType = type;
const btnFull = document.getElementById('btnFull');
const btnInst = document.getElementById('btnInst');
​if (type === 'full') {
btnFull.className = 'p-3 border rounded-xl text-left bg-sky-950/60 border-sky-500 text-sky-200';
btnInst.className = 'p-3 border rounded-xl text-left bg-slate-800 border-slate-700 text-slate-300';
} else {
btnInst.className = 'p-3 border rounded-xl text-left bg-sky-950/60 border-sky-500 text-sky-200';
btnFull.className = 'p-3 border rounded-xl text-left bg-slate-800 border-slate-700 text-slate-300';
}
}
​function addIngredient(ingredient) {
const promptInput = document.getElementById('promptInput');
if (promptInput.value.length > 0) {
promptInput.value += ', ' + ingredient;
} else {
promptInput.value = ingredient;
}
}
​function showStatus(message) {
const toast = document.getElementById('statusToast');
toast.innerText = message;
toast.classList.remove('hidden');
}
​function hideStatus() {
document.getElementById('statusToast').classList.add('hidden');
}
​async function handleGenerate() {
const prompt = document.getElementById('promptInput').value.trim();
if (!prompt) {
alert('Please enter a description or tap a sonic ingredient!');
return;
}
​const btn = document.getElementById('generateBtn');
const btnText = document.getElementById('btnText');
const btnSpinner = document.getElementById('btnSpinner');
​btn.disabled = true;
btnText.innerText = 'Initializing Mix...';
btnSpinner.classList.remove('hidden');
showStatus('⏳ Requesting track generation from AI...');
​try {
// Step 1: Request creation
const response = await fetch('/api/generate-music', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
prompt: prompt,
custom_mode: songType
})
});
​const data = await response.json();
​if (!response.ok || data.error) {
throw new Error(data.error || 'Failed to start music generation');
}
​const taskId = data.task_id || data.id || (data.data && data.data.task_id);
​if (!taskId) {
throw new Error('No Task ID returned from generator');
}
​// Step 2: Poll for completion
showStatus('🎼 AI is generating your track (approx 30-60s)...');
btnText.innerText = 'Rendering Audio...';
​let audioUrl = '';
let attempts = 0;
const maxAttempts = 30; // 30 * 5s = 150 seconds cutoff
​while (attempts < maxAttempts) {
await new Promise(resolve => setTimeout(resolve, 5000));
attempts++;
​showStatus(🎼 Rendering audio... (${attempts * 5}s));
​const statusRes = await fetch(/api/status/${taskId});
if (statusRes.ok) {
const statusData = await statusRes.json();
​audioUrl = statusData.audio_url ||
(statusData.response && statusData.response.audio_url) ||
(statusData.data && statusData.data.audio_url);
​if (audioUrl) break;
}
}
​if (!audioUrl) {
throw new Error('Track generation timed out. Please try again.');
}
​showStatus('✅ Mix generated successfully!');
addTrackToHistory(prompt, audioUrl);
​} catch (err) {
alert('Error: ' + err.message);
hideStatus();
} finally {
btn.disabled = false;
btnText.innerText = 'Create Mix';
btnSpinner.classList.add('hidden');
}
}
​function addTrackToHistory(title, url) {
const container = document.getElementById('mixesContainer');
const emptyText = document.getElementById('emptyText');
if (emptyText) emptyText.remove();
​const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
​const card = document.createElement('div');
card.className = 'bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3';
card.innerHTML = <div class="flex justify-between items-start"> <div class="font-semibold text-xs text-sky-300">Mix #${container.children.length + 1}</div> <div class="text-[10px] text-slate-500">${time}</div> </div> <p class="text-xs text-slate-200 font-medium">"${title}"</p> <audio controls class="w-full h-10 rounded-lg"> <source src="${url}" type="audio/mpeg"> Your browser does not support audio playback. </audio> <a href="${url}" target="_blank" download class="block text-center w-full bg-sky-500/20 text-sky-300 border border-sky-500/30 text-xs py-2 rounded-lg font-semibold hover:bg-sky-500/30"> 📥 Download Audio File </a>;
​container.prepend(card);
}
</script>
</body>
</html>
